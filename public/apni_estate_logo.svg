<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background transparent -->
  <g fill="#0B2545">
    <!-- Main Navy Block with Negative Space House Cutout -->
    <path d="M 115 50 
             L 285 50 
             L 285 170 
             L 230 120 
             L 190 155 
             L 190 122 
             L 155 122 
             L 155 186 
             L 115 240 
             Z" />
    
    <!-- 4-Pane Window in the Gable -->
    <!-- Top-Left Pane -->
    <rect x="215" y="148" width="12" height="12" rx="0.5" />
    <!-- Top-Right Pane -->
    <rect x="230" y="148" width="12" height="12" rx="0.5" />
    <!-- Bottom-Left Pane -->
    <rect x="215" y="163" width="12" height="12" rx="0.5" />
    <!-- Bottom-Right Pane -->
    <rect x="230" y="163" width="12" height="12" rx="0.5" />

    <!-- APNI ESTATE Typography -->
    <text 
      x="200" 
      y="305" 
      font-family="'Plus Jakarta Sans', 'Outfit', system-ui, -apple-system, sans-serif" 
      font-size="44" 
      font-weight="800" 
      letter-spacing="0.24em" 
      text-anchor="middle"
    >APNI ESTATE</text>
  </g>
</svg>
